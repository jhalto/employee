{% extends 'base.html' %}

{% block content %}
<a href="{% url 'employee_add' %}"><button>Add Emplooyee</button></a> 


<table>
    <thead>
        <tr>
            <th>Profile</th>
            <th>Name</th>
            <th>Email</th>
            <th>address</th>
            <th>department</th>
            <th>manager</th>
        </tr>
    </thead>

    <tbody>
        {% for employee in employee %}
        <tr>
            <td> <img class="image" src="{{ employee.image.url }}" alt="{{ employee.first_name }}" width="50" height="50"></td>
            <td>{{ employee.first_name }} {{ employee.last_name }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.address }}</td>
            <td>{{ employee.department }}</td>
            <td>{{ employee.manager }}</td>
        </tr>
        {% endfor %}
    </tbody>

</table>

{% endblock %}
